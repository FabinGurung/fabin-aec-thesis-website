name: Validate Next.js thesis website for GitHub Pages

on:
  push:
    branches: [github-pages-nextjs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-nextjs-validation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up exact Node.js toolchain
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Confirm exact Node.js and npm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.9.0"

      - name: Determine GitHub Pages base path
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ "$REPOSITORY_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            BASE_PATH=""
          else
            BASE_PATH="/$REPOSITORY_NAME"
          fi

          echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "GitHub Pages base path: ${BASE_PATH:-/}"

      - name: Install clean Next.js migration dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install

      - name: Verify source content, graph and security boundaries
        run: npm run test:pages

      - name: Build Next.js static export
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Inspect generated static files
        shell: bash
        run: |
          echo "============================================"
          echo "Generated out/ file structure"
          echo "============================================"

          find out -maxdepth 5 -type f -print | sort

          echo ""
          echo "============================================"
          echo "Generated HTML files"
          echo "============================================"

          find out -type f -name "*.html" -print | sort

      - name: Verify generated GitHub Pages output
        run: npm run verify:pages-output

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      # Deployment intentionally disabled during migration validation.
      #
      # Once all nine routes pass static-export validation,
      # this job will be enabled.
